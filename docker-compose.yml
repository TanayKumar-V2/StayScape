services:
  redis:
    image: redis:7-alpine
    container_name: stayscape-redis
    restart: unless-stopped
    ports:
      # Loopback only: never expose an unauthenticated Redis to the network.
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --loglevel notice
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  redis_data:
    name: stayscape_redis_data
    driver: local

